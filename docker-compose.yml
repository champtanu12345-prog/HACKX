version: '3.8'

services:
  # PostGIS Database Service
  db:
    image: postgis/postgis:16-3.4
    container_name: hackx-postgis
    restart: always
    environment:
      POSTGRES_USER: hackx
      POSTGRES_PASSWORD: hackx_secret
      POSTGRES_DB: hackx_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackx -d hackx_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hackx-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://hackx:hackx_secret@db:5432/hackx_db
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  # React Maritime Workstation Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackx-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
